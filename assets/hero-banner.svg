<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">

  <title id="title">Pradnyeel Patil</title>
  <desc id="desc">Computer Engineering student exploring AI and software development.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D22"/>
      <stop offset="50%" stop-color="#171447"/>
      <stop offset="100%" stop-color="#102A52"/>
      <animate attributeName="x1"
               values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
      <animate attributeName="x1"
               values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGradient">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
      <animate attributeName="x1"
               values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orb">
      <stop offset="0%" stop-color="#818CF8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none" stroke="#A5B4FC" stroke-opacity=".09"/>
    </pattern>

    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="336" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#background)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- Ambient light -->
    <circle cx="180" cy="45" r="230" fill="url(#orb)">
      <animate attributeName="cx"
               values="180;270;180" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1040" cy="300" r="260" fill="url(#orb)">
      <animate attributeName="cy"
               values="300;220;300" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating particles -->
    <g fill="#C4B5FD">
      <circle cx="105" cy="95" r="2">
        <animate attributeName="cy" values="95;70;95" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="85" r="2.5">
        <animate attributeName="cy" values="85;110;85" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="260" r="2">
        <animate attributeName="cy" values="260;235;260" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="265" r="2.5">
        <animate attributeName="cy" values="265;285;265" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="65" r="1.8">
        <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="370" cy="80" r="1.8">
        <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Decorative orbit -->
    <g transform="translate(1040 170)">
      <ellipse rx="92" ry="35" fill="none"
               stroke="#818CF8" stroke-opacity=".35"
               transform="rotate(-35)"/>
      <ellipse rx="92" ry="35" fill="none"
               stroke="#67E8F9" stroke-opacity=".25"
               transform="rotate(35)"/>
      <circle r="5" fill="#67E8F9">
        <animateTransform attributeName="transform"
          type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" cx="0" cy="-35" fill="#A78BFA">
        <animateTransform attributeName="transform"
          type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main text -->
    <text x="600" y="76"
          font-family="monospace" font-size="20"
          letter-spacing="5" text-anchor="middle"
          fill="#A5B4FC">HELLO, WORLD! I'M</text>

    <text x="600" y="151"
          font-family="Arial, Helvetica, sans-serif"
          font-size="75" font-weight="700"
          letter-spacing="1" text-anchor="middle"
          fill="url(#nameGradient)">Pradnyeel Patil</text>

    <!-- Accent line -->
    <rect x="480" y="177" width="240" height="2" rx="1"
          fill="url(#borderGradient)">
      <animate attributeName="width"
               values="100;240;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x"
               values="550;480;550" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="216"
          font-family="Arial, Helvetica, sans-serif"
          font-size="17" text-anchor="middle"
          fill="#E0E7FF">Computer Engineer</text>

    <text x="600" y="247"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20" text-anchor="middle"
          fill="#A5B4FC">Artificial Intelligence  •  Software Development  •  Machine Learning</text>

    <!-- Bottom status -->
    <circle cx="454" cy="292" r="4" fill="#34D399">
      <animate attributeName="opacity"
               values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="297"
          font-family="monospace" font-size="12"
          letter-spacing="2" text-anchor="middle"
          fill="#CBD5E1">LEARN  /  BUILD  /  EVOLVE</text>

    <!-- Border -->
    <rect x="2" y="2" width="1196" height="336" rx="22"
          fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>
  </g>
</svg>
